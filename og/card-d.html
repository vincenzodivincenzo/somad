<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:BNCE,INFM,wght@-100..100,0..100,300..800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#111;font-family:'Nunito',sans-serif}
.card{position:relative;width:1200px;height:630px;overflow:hidden}
.bg{position:absolute;inset:0;background:url("src/d.jpg") center/cover no-repeat;filter:grayscale(1) contrast(1.15) brightness(.62)}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.05) 25%,rgba(0,0,0,.6) 100%)}
.grain{position:absolute;inset:0;opacity:.14;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);width:720px;filter:drop-shadow(0 8px 0 rgba(0,0,0,.4))}
.tag{position:absolute;left:0;right:0;bottom:64px;text-align:center;color:#F3F1EA;font-family:'Shantell Sans',cursive;font-weight:700;font-size:34px;font-variation-settings:"BNCE" 30,"INFM" 60;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.pill{position:absolute;right:40px;top:36px;background:#FFB524;color:#111;font-weight:800;font-size:22px;padding:8px 18px;border:3px solid #111;border-radius:255px 15px 225px 15px / 15px 225px 15px 255px;transform:rotate(3deg)}
</style></head><body><div class="card"><div class="bg"></div><div class="grain"></div>
<img class="logo" src="../assets/logo.svg" alt="SOMAD surftrips">
<div class="tag">Experiencias. Comunidad. Viajes.</div>
<div class="pill">somadtrips.vercel.app</div>
</div></body></html>
